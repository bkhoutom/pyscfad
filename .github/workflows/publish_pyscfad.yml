name: Publish pyscfad

on:
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  publish_pypi_any:
    name: Build distributions on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build source distribution and repaired binary wheels
        run: |
            python3 -m pip install --upgrade build cibuildwheel
            python3 -m build --sdist
            python3 -m cibuildwheel --platform linux --output-dir dist
        env:
          CIBW_SKIP: "pp* *musllinux* cp3??t-*"
          CIBW_ENVIRONMENT: "CMAKE_BUILD_PARALLEL_LEVEL=2"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

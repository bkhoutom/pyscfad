name: Publish pyscfadlib

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build repaired binary wheels
        run: |
          python -m pip install --upgrade cibuildwheel
          python -m cibuildwheel pyscfadlib --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT: "CMAKE_BUILD_PARALLEL_LEVEL=2"
      - uses: actions/upload-artifact@v4
        with:
          name: pyscfadlib-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish_pypi:
    needs: build_wheels
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist pyscfadlib --outdir dist
      - uses: actions/download-artifact@v4
        with:
          pattern: pyscfadlib-wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
